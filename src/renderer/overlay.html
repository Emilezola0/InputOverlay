<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>InputMemory Overlay</title>
  <link rel="stylesheet" href="widgets.css" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { display: inline-block; padding: 6px; user-select: none; }
    #root {
      display: inline-flex;
      gap: 8px;
      align-items: flex-start;
      --u: 30px;
    }
    #root.vertical { flex-direction: column; }
    #root.horizontal { flex-direction: row; }
    .ov-slot { position: relative; }
    .ov-card {
      background: rgba(15, 17, 23, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px;
    }
    .ov-card .mouse { --u: 32px; }
    .ov-card .gamepad { --u: 34px; }
    .ov-card .history { width: 250px; }
    .ov-card .hist-row { background: rgba(31, 35, 48, 0.85); }
    .ov-card .pad-status { font-size: 11px; }

    /* ---- Mode édition (overlay déverrouillé) ---- */
    #toolbar { display: none; }
    body.editing #toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; width: max-content; max-width: 600px;
      background: #1b1e2b; border: 1px solid #7c5cff; color: #e6e8ef; font: 600 11px 'Segoe UI', sans-serif;
      padding: 5px 6px; border-radius: 8px; margin-bottom: 8px; cursor: move;
    }
    .tb-group { display: inline-flex; align-items: center; gap: 3px; padding: 0 4px; border-left: 1px solid #2c3142; }
    .tb-group:first-of-type { border-left: none; }
    .tb-label { color: #8b91a5; font-weight: 600; margin-right: 2px; }
    #toolbar button, .card-tools button {
      background: #272b3b; color: #e6e8ef; border: 1px solid #353a4e; border-radius: 5px;
      font: 700 11px 'Segoe UI', sans-serif; padding: 2px 7px; cursor: pointer; min-width: 22px;
    }
    #toolbar button:hover, .card-tools button:hover { border-color: #7c5cff; }
    #toolbar button.off { opacity: 0.45; text-decoration: line-through; }
    #toolbar button.lock { background: #7c5cff; border-color: #7c5cff; }
    .tb-val { min-width: 34px; text-align: center; color: #c9cede; }
    body.editing #content { outline: 2px dashed #7c5cff; outline-offset: 3px; border-radius: 10px; cursor: move; }
    .card-tools { display: none; }
    body.editing .ov-slot:hover .card-tools {
      display: flex; gap: 3px; position: absolute; top: -10px; right: -4px; z-index: 5;
      background: #1b1e2b; border: 1px solid #7c5cff; border-radius: 6px; padding: 2px; cursor: default;
    }
    .card-tools .size { color: #c9cede; font: 600 10px 'Segoe UI', sans-serif; align-self: center; padding: 0 3px; }
    .card-grip { display: none; }
    body.editing .card-grip {
      display: block; position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; cursor: nwse-resize;
      border-right: 3px solid #7c5cff; border-bottom: 3px solid #7c5cff; border-radius: 0 0 6px 0; opacity: 0.8;
    }
    body.editing .ov-slot:hover .card-grip { opacity: 1; }
    .ov-placeholder { color: #8b91a5; font: 12px 'Segoe UI', sans-serif; padding: 4px 6px; min-width: 200px; }

    #rec-wrap { margin-bottom: 6px; }
    .ov-train { display: flex; flex-direction: column; gap: 6px; font-family: 'Segoe UI', sans-serif; color: #e6e8ef; min-width: 240px; max-width: 420px; }
    .ov-train-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 12px; color: #8b91a5; }
    .ov-verdict { white-space: nowrap; }
    .ov-train-head b { color: #e6e8ef; font-size: 13px; }
    .ov-verdict { font-size: 18px; font-weight: 800; }
    .ov-steps { display: flex; flex-wrap: wrap; gap: 4px; }
    .ov-step { padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 13px; background: rgba(31,35,48,.9); border: 1px solid #2c3142; }
    .ov-step.s-ok { background: #1d4a32; border-color: #3fdc8a; }
    .ov-step.s-almost { background: #4a3d16; border-color: #f0b940; }
    .ov-step.s-miss { background: #4a1a24; border-color: #ff6b81; }
    .ov-step.s-pending { opacity: .6; }
    .ov-detail { font-size: 11px; color: #c9cede; }
    .v-parfait { color: #3fdc8a; } .v-reussi { color: #8ee0a0; } .v-presque { color: #f0b940; } .v-rate { color: #ff6b81; }
    .ov-empty { color: #8b91a5; font: 12px 'Segoe UI', sans-serif; padding: 6px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="toolbar" title="Glisse pour déplacer · molette sur un widget pour changer sa taille">
      <span class="tb-group"><span class="tb-label">⠿ Afficher</span><span id="tb-widgets"></span></span>
      <span class="tb-group"><span class="tb-label">Taille</span><button data-act="scale-">−</button><span id="tb-scale" class="tb-val"></span><button data-act="scale+">+</button></span>
      <span class="tb-group"><span class="tb-label">Opacité</span><button data-act="op-">−</button><span id="tb-op" class="tb-val"></span><button data-act="op+">+</button></span>
      <span class="tb-group"><button data-act="dir" id="tb-dir"></button><button data-act="reset" title="Remet toutes les tailles à 100 %">Réinit.</button><button data-act="app" title="Ouvrir la fenêtre InputMemory">Appli</button></span>
      <span class="tb-group"><button data-act="lock" class="lock" id="tb-lock"></button></span>
    </div>
    <div id="content">
      <div id="rec-wrap" hidden><span id="rec-badge" class="rec-badge">REC</span></div>
      <div id="root"></div>
    </div>
  </div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
