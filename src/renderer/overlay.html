<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>InputMemory Overlay</title>
  <link rel="stylesheet" href="widgets.css" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { display: inline-block; padding: 6px; }
    #root {
      display: inline-flex;
      gap: 8px;
      align-items: flex-start;
      --u: 30px;
    }
    #root.vertical { flex-direction: column; }
    #root.horizontal { flex-direction: row; }
    .ov-card {
      background: rgba(15, 17, 23, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px;
    }
    .ov-card .mouse { --u: 32px; }
    .ov-card .gamepad { --u: 34px; }
    .ov-card .history { width: 250px; }
    .ov-card .hist-row { background: rgba(31, 35, 48, 0.85); }
    .ov-card .pad-status { font-size: 11px; }

    /* Mode édition (déverrouillé) : on peut déplacer la fenêtre */
    body.editing #root { -webkit-app-region: drag; cursor: move; outline: 2px dashed #7c5cff; outline-offset: 3px; border-radius: 10px; }
    #edit-hint { display: none; }
    body.editing #edit-hint {
      display: block;
      background: #7c5cff; color: #fff; font: 600 11px 'Segoe UI', sans-serif;
      padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; white-space: nowrap;
    }
    #rec-wrap { margin-bottom: 6px; }
    .ov-empty { color: #8b91a5; font: 12px 'Segoe UI', sans-serif; padding: 6px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="edit-hint">Glisse pour déplacer · Ctrl+Maj+L pour verrouiller</div>
    <div id="rec-wrap" hidden><span id="rec-badge" class="rec-badge">REC</span></div>
    <div id="root"></div>
  </div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
